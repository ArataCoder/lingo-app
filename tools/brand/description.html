<!DOCTYPE html>
<!-- "What can this bot do?" animation for @BotFather (/setdescriptionpic). 960x540, 6 s loop.
     Rendered frame by frame by tools/brand/render.cjs; all motion is CSS keyframes on one 6 s timeline. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 960px; height: 540px; overflow: hidden; background: #12131C; }
  body { font-family: "Plus Jakarta Sans", sans-serif; color: #EEEEFF; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 960px; height: 540px; overflow: hidden;
    background: radial-gradient(120% 90% at 30% 20%, #262844 0%, #1A1B26 55%, #12131C 100%); }
  /* every animation uses the same 6 s duration, so one currentTime drives the whole scene */
  .a { animation-duration: 6s; animation-timing-function: linear; animation-fill-mode: both; animation-iteration-count: infinite; }

  .orb { position: absolute; border-radius: 50%; filter: blur(60px); }
  .o1 { width: 420px; height: 420px; left: -60px; top: 40px; background: #F7A046; opacity: .30; }
  .o2 { width: 380px; height: 380px; right: -80px; bottom: -120px; background: #9D7CD8; opacity: .32; }

  #girl { position: absolute; left: 8px; bottom: -30px; width: 470px; transform-origin: 50% 100%; animation-name: girlIn; }
  #girl img { width: 100%; display: block; filter: drop-shadow(0 0 3px rgba(247,160,70,.9)) drop-shadow(0 0 22px rgba(247,160,70,.45)); }
  @keyframes girlIn {
    0%    { transform: translateY(90px) scale(.86); opacity: 0; }
    9%    { transform: translateY(-14px) scale(1.03); opacity: 1; }
    13%   { transform: translateY(4px) scale(.99); }
    16%   { transform: translateY(0) scale(1) rotate(0); }
    20%   { transform: rotate(-3deg); }
    24%   { transform: rotate(2deg); }
    28%   { transform: rotate(0); }
    50%   { transform: translateY(-6px); }
    72%   { transform: translateY(0); }
    86%   { transform: translateY(-4px); opacity: 1; }
    95%,100% { transform: translateY(20px) scale(.97); opacity: 0; }
  }
  .spark { position: absolute; color: #FFE2A8; font-size: 34px; line-height: 1; text-shadow: 0 0 10px #FFB84D, 0 0 22px rgba(255,170,60,.9); opacity: 0; }
  #s1 { left: 57%; top: 26%; animation-name: spark1; }
  #s2 { left: 66%; top: 18%; font-size: 20px; animation-name: spark2; }
  @keyframes spark1 { 0%,15% { opacity: 0; transform: scale(.2) rotate(0); } 19% { opacity: 1; transform: scale(1.2) rotate(70deg); } 25% { opacity: 0; transform: scale(.3) rotate(150deg); }
                      52% { opacity: 0; transform: scale(.2) rotate(0); } 56% { opacity: 1; transform: scale(1.1) rotate(70deg); } 62%,100% { opacity: 0; transform: scale(.3) rotate(150deg); } }
  @keyframes spark2 { 0%,18% { opacity: 0; transform: scale(.2); } 22% { opacity: 1; transform: scale(1); } 28%,100% { opacity: 0; transform: scale(.3) rotate(90deg); } }

  #copy { position: absolute; left: 470px; top: 92px; width: 470px; }
  #title { font-size: 84px; font-weight: 800; letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
  #title span { display: inline-block; animation-name: letter; }
  #title .br { background: linear-gradient(100deg, #FFB45E, #F7A046 40%, #FF7A59); -webkit-background-clip: text; background-clip: text; color: transparent; }
  @keyframes letter { 0% { opacity: 0; transform: translateY(36px) scale(.9); filter: blur(6px); }
                      8% { opacity: 1; transform: translateY(-4px) scale(1.02); filter: blur(0); } 10% { transform: none; }
                      88% { opacity: 1; transform: none; } 94%,100% { opacity: 0; transform: translateY(-14px); } }
  #title .sp { width: .28em; }

  .rise { opacity: 0; animation-name: rise; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(18px); } 7% { opacity: 1; transform: none; }
                    88% { opacity: 1; transform: none; } 94%,100% { opacity: 0; transform: translateY(-10px); } }
  #pill { display: inline-block; margin-top: 18px; padding: 6px 14px; border-radius: 999px; font-size: 18px; font-weight: 800; letter-spacing: .06em;
    color: #12131C; background: #9D7CD8; box-shadow: 0 6px 18px -6px #9D7CD8; }
  #tag { margin-top: 16px; font-size: 32px; font-weight: 700; line-height: 1.2; color: #EEEEFF; }
  #chips { display: flex; gap: 10px; margin-top: 22px; }
  .chip { display: flex; align-items: center; gap: 10px; padding: 9px 14px 9px 9px; border-radius: 16px; background: rgba(36,40,59,.9); border: 1px solid rgba(255,255,255,.08); font-size: 18px; font-weight: 700; color: #C9CFEA; }
  .chip b { display: grid; place-items: center; width: 36px; height: 30px; border-radius: 9px; font-size: 15px; font-weight: 800; color: #12131C; }
  .es b { background: #F7A046; } .en b { background: #9D7CD8; }
  #foot { display: flex; align-items: center; gap: 14px; margin-top: 26px; font-size: 20px; font-weight: 700; color: #A9B1D6; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; background: rgba(255,255,255,.12); animation-name: dotOn; }
  @keyframes dotOn { 0% { background: rgba(255,255,255,.12); box-shadow: none; transform: scale(1); }
                     3% { background: #10B981; box-shadow: 0 0 10px rgba(16,185,129,.7); transform: scale(1.35); }
                     6% { transform: scale(1); background: #10B981; box-shadow: 0 0 10px rgba(16,185,129,.55); }
                     88% { background: #10B981; opacity: 1; } 94%,100% { background: #10B981; opacity: 0; } }
</style>
</head>
<body>
<div id="stage">
  <div class="orb o1"></div><div class="orb o2"></div>
  <div id="girl" class="a"><img src="mascot-start.png" alt=""><i id="s1" class="spark a">✦</i><i id="s2" class="spark a">✦</i></div>
  <div id="copy">
    <div id="title"></div>
    <div id="pill" class="rise a">ADHD-FRIENDLY</div>
    <div id="tag" class="rise a">Языки для мозга,<br>которому быстро скучно</div>
    <div id="chips"><div class="chip es rise a"><b>ES</b>Испанский с нуля</div><div class="chip en rise a"><b>EN</b>Английский B1+</div></div>
    <div id="foot" class="rise a"><div class="dots"><i class="dot a"></i><i class="dot a"></i><i class="dot a"></i><i class="dot a"></i><i class="dot a"></i></div>2 минуты в день</div>
  </div>
</div>
<script>
  // Letters and staggered delays. Negative delay = start that far into the 6 s timeline.
  var t = document.getElementById("title"), words = [["Lingo", ""], ["Brain", "br"]], i = 0;
  words.forEach(function (w, wi) {
    if (wi) { var s = document.createElement("span"); s.className = "sp a"; s.innerHTML = "&nbsp;"; t.appendChild(s); }
    w[0].split("").forEach(function (ch) {
      var s = document.createElement("span"); s.className = "a " + w[1]; s.textContent = ch;
      s.style.animationDelay = (0.55 + i * 0.07) + "s"; t.appendChild(s); i++;
    });
  });
  // the "fade out" keyframes of delayed elements must still land at ~5.4 s: shorten their run by the delay
  function lane(el, start) { el.style.animationDelay = start + "s"; el.style.animationDuration = (6 - start) + "s"; el.style.animationIterationCount = "1"; }
  [].forEach.call(t.children, function (s) { var d = parseFloat(s.style.animationDelay) || 0.55; lane(s, d); });
  lane(document.getElementById("pill"), 1.35);
  lane(document.getElementById("tag"), 1.55);
  var ch = document.querySelectorAll(".chip"); lane(ch[0], 1.95); lane(ch[1], 2.12);
  lane(document.getElementById("foot"), 2.4);
  [].forEach.call(document.querySelectorAll(".dot"), function (d, k) { lane(d, 2.75 + k * 0.16); });
</script>
</body>
</html>
