name: Lingo Brain audio (edge-tts)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "generate_audio.py"

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python generate_audio.py
      - name: Commit mp3
        run: |
          git config user.name "lingo-audio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/audio
          if git diff --cached --quiet; then echo "nothing new"; else git commit -m "audio: neural voices" && git push; fi
